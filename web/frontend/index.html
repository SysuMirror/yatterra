<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a84ff" />
    <meta name="description" content="YatTerra — 普适性的技术基础设施" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YatTerra" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="YatTerra" />
    <meta name="msapplication-TileColor" content="#0a84ff" />
    <meta name="msapplication-tooltip" content="YatTerra" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/yatterra-ios-180-dc6670bea68a.png" />
    <title>YatTerra</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('yatterra_theme');
          var mode = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system';
          var resolved = mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : mode === 'dark' ? 'dark' : 'light';
          var root = document.documentElement;
          root.dataset.themeMode = mode;
          root.dataset.theme = resolved;
          root.classList.toggle('theme-dark', resolved === 'dark');
          root.classList.toggle('theme-light', resolved === 'light');
          root.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    <div id="root">
      <div id="boot-msg" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,-apple-system,'PingFang SC',sans-serif;color:#8fa5b0;background:#0b1723">
        <span style="width:26px;height:26px;border:2px solid #2b4653;border-top-color:#9aebd2;border-radius:50%;animation:boot-spin .8s linear infinite"></span>
        <span style="font-size:13px;letter-spacing:.4px">正在载入 YatTerra…</span>
        <style>@keyframes boot-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){#boot-msg span:first-child{animation:none}}</style>
      </div>
    </div>
    <script>
      // Inline diagnostic — runs before React, visible even if JS bundle fails
      window.__SPA_DIAG = [];
      window.__SPA_DIAG.push('inline-script OK ' + new Date().toISOString());
      window.addEventListener('error', function(e) {
        window.__SPA_DIAG.push('ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
        var el = document.getElementById('boot-msg');
        if (el) el.innerHTML = '<b style="color:#ff453a">⚠ JS Error:</b> ' + e.message +
          '<br><span style="font-size:12px">' + e.filename + ':' + e.lineno + '</span>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
