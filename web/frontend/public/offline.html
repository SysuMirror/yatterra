<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sseinfra — 离线</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
      background: linear-gradient(160deg, #f0f4ff 0%, #f5f0ff 30%, #f0fdf4 55%, #fef9f0 80%, #f0f4ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      border-radius: 20px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 0.5px solid rgba(255,255,255,0.5);
      box-shadow: 0 0 0 0.5px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.08), 0 16px 48px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.4);
      max-width: 400px;
      width: 100%;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; color: #1d1d1f; }
    p { font-size: 15px; color: #86868b; line-height: 1.5; margin-bottom: 24px; }
    button {
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      color: white;
      background: #0a84ff;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 0 0.5px rgba(10,132,255,0.3), 0 2px 8px rgba(10,132,255,0.2);
      transition: background 0.1s;
    }
    button:hover { background: #0071e3; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>当前离线</h1>
    <p>无法连接到服务器。请检查网络连接后重试。</p>
    <button onclick="window.location.reload()">重新加载</button>
  </div>
</body>
</html>
